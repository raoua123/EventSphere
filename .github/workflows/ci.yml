name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: event_reservation_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://user:secret@localhost:5432/event_reservation_test?serverVersion=15&charset=utf8
      JWT_PASSPHRASE: test_passphrase
      JWT_TOKEN_TTL: 3600
      APP_ENV: test
      APP_SECRET: testsecretkey32charslong12345678
      MAILER_DSN: null://null
      APP_DOMAIN: localhost
      WEBAUTHN_RP_NAME: "EventSphere Test"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, openssl, json, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genpkey -out config/jwt/private.pem -algorithm rsa -pkeyopt rsa_keygen_bits:2048 -pass pass:test_passphrase
          openssl pkey -in config/jwt/private.pem -passin pass:test_passphrase -out config/jwt/public.pem -pubout

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run tests
        run: php bin/phpunit --testdox