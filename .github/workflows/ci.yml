name: PHPUnit Tests

on: [push, pull_request]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: event_reservation_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          coverage: none

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist
          composer require "doctrine/instantiator:^2.1" --dev --ignore-platform-reqs

      - name: Build Database Schema
        run: |
          # Use 127.0.0.1 for GitHub Services
          DATABASE_URL="postgresql://user:password@127.0.0.1:5432/event_reservation_test?serverVersion=15" php bin/console doctrine:schema:create --env=test --dump-sql > schema.sql
          PGPASSWORD=password psql -h 127.0.0.1 -U user -d event_reservation_test -f schema.sql

      - name: Run Tests
        # Pass the DB URL again here to be absolutely sure
        run: DATABASE_URL="postgresql://user:password@127.0.0.1:5432/event_reservation_test?serverVersion=15" vendor/bin/simple-phpunit --testdox
