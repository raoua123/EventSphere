name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: event_reservation_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, openssl, json, mbstring
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genpkey -out config/jwt/private.pem -algorithm rsa -pkeyopt rsa_keygen_bits:2048
          openssl pkey -in config/jwt/private.pem -out config/jwt/public.pem -pubout
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://user:secret@localhost:5432/event_reservation_test
          JWT_PASSPHRASE: test_passphrase
          JWT_TOKEN_TTL: 3600
        run: php bin/console doctrine:migrations:migrate --no-interaction
      - name: Run tests
        env:
          DATABASE_URL: postgresql://user:secret@localhost:5432/event_reservation_test
          JWT_PASSPHRASE: test_passphrase
          JWT_TOKEN_TTL: 3600
        run: php bin/phpunit
